name: ci

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  required:
    name: required
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate local platform definition
        env:
          POSTGRES_PASSWORD: synthetic-config-validation-only
          RABBITMQ_PASSWORD: synthetic-config-validation-only
          REDIS_PASSWORD: synthetic-config-validation-only
        run: docker compose --profile aws --profile chaos config --quiet

      - name: Restore locked dependencies
        run: dotnet restore SquadUp.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format SquadUp.slnx --no-restore --verify-no-changes

      - name: Build
        run: >-
          dotnet build SquadUp.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >-
          dotnet test SquadUp.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=normal"

      - name: Build and smoke test Lobby container
        run: ./scripts/test-lobby-container
