name: squad-up

services:
  postgres:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_DB: squadup
      POSTGRES_USER: squadup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/dev-up to create the local environment file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:4.2.9-management@sha256:05a8dd87c954fffbdb34698f70a9de479239b38890694efa6a58dcfb792de1bf
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: squadup
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run ./scripts/dev-up to create the local environment file}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$REDISCLI_AUTH" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run ./scripts/dev-up to create the local environment file}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  jaeger:
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      jaeger:
        condition: service_started
    volumes:
      - ./deploy/docker/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true

  localstack:
    profiles: [aws]
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    user: "1000:1000"
    environment:
      AWS_DEFAULT_REGION: us-east-1
      SERVICES: sqs,sns,secretsmanager
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  toxiproxy:
    profiles: [chaos]
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    user: "65532:65532"
    ports:
      - "127.0.0.1:${TOXIPROXY_API_PORT:-8474}:8474"
      - "127.0.0.1:${TOXIPROXY_PROXY_PORT:-8666}:8666"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "--host", "http://127.0.0.1:8474", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  localstack-data:
